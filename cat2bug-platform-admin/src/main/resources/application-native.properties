# Native 镜像构建专用（由 Quarkus 在 -Dnative 构建时自动加载）

quarkus.native.resources.includes=db/**,mapper/**,oper-log-rules.tsv,META-INF/resources/**
quarkus.telemetry.enabled=false

quarkus.native.additional-build-args=--features=com.cat2bug.quarkus.admin.nativeimage.NativeRuntimeInitFeature,--initialize-at-run-time=io.netty.util.internal.PlatformDependent0,--initialize-at-run-time=io.netty.util.internal.PlatformDependent,--initialize-at-run-time=io.netty.util.internal.SocketUtils,--initialize-at-run-time=io.smallrye.common.ref.References,--initialize-at-run-time=sun.java2d.Disposer,--initialize-at-run-time=org.apache.commons.compress,--initialize-at-run-time=com.mysql.cj.jdbc.AbandonedConnectionCleanupThread,--initialize-at-run-time=com.mysql.cj.otel.OpenTelemetryHandler,--initialize-at-run-time=org.eclipse.jgit.internal.storage.file.WindowCache,--initialize-at-run-time=org.eclipse.jgit.lib.internal.WorkQueue,--initialize-at-run-time=org.eclipse.jgit.util.FileUtils,--initialize-at-run-time=cn.hutool.crypto.SmUtil,--initialize-at-run-time=cn.hutool.http.ssl.DefaultSSLInfo,--initialize-at-run-time=cn.hutool.http.HttpGlobalConfig,--initialize-at-run-time=cn.hutool.core.lang.id.NanoId,--report-unsupported-elements-at-runtime

quarkus.http.host=0.0.0.0
