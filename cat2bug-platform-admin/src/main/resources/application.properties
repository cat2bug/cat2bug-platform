quarkus.application.name=cat2bug-admin
quarkus.http.port=2020
# 禁用 Vert.x 在 GET / 自动返回 index.html；HTML 路由由 EmbeddedSpaFallbackFilter 处理
quarkus.http.static-resources.index-page=cat2bug-spa-fallback-only.html
cat2bug.version=1.1.0

# 安装配置：生产环境见 application-prod.properties；或启动前设置：
# export QUARKUS_CONFIG_LOCATIONS=./config/install/application-install.yml,./config/install/quarkus-runtime.properties
# dev 模式由 dev.sh 在检测到 install/runtime 文件后注入 QUARKUS_CONFIG_LOCATIONS

# 会话：memory（dev/test 默认）| redis（与 Spring J2Cache 同 Redis 时）
cat2bug.session.store=memory
# 应用缓存：local（dev 默认）| redis（Phase 3+ 与 J2Cache 对齐）
cat2bug.cache.type=local
# cat2bug.session.store=redis
# cat2bug.redis.hosts=redis://127.0.0.1:6379

# 安装向导：磁盘 install 文件判定是否已安装（与 Spring 一致）
cat2bug.install.config-path=./config/install/application-install.yml
cat2bug.bootstrap.mode=true
cat2bug.token.secret=abcdefghijklmnopqrstuvwxyz
cat2bug.token.expire-minutes=240
cat2bug.profile=./upload

# 微信小程序登录（与 Spring application.yml 对齐；未配置时留空即可）
# cat2bug.login.wechat-mp.appid=
# cat2bug.login.wechat-mp.secret=

# Open API（CAT2BUG-API-KEY 鉴权，与 Spring cat2bug.api.enabled 对齐）
cat2bug.api.enabled=true

# 对外访问地址（OAuth issuer、MCP 地址）。反向代理部署必须配置，如 https://bug.example.com；
# 未配置时按 X-Forwarded-Proto / X-Forwarded-Host / Host 推导
# cat2bug.public-url=
cat2bug.oauth.rate-limit.register-per-minute=10
cat2bug.oauth.rate-limit.token-per-minute=60

# 个人访问令牌 / OAuth 访问令牌只在 MCP 路径生效（AccessTokenAuthMechanism），其它路径仍走 JAX-RS JWT
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated

# AI（enabled/host 由安装向导写入 install 配置；此处保留默认模型列表）
cat2bug.ai.enabled=false
cat2bug.ai.timeout=300

# OpenAI Chat Completions（与 Spring cat2bug.open-ai 对齐）
cat2bug.open-ai.enabled=true
cat2bug.open-ai.timeout=300
cat2bug.ai.default-business-model=llama3:8b
cat2bug.ai.models=llama3:8b,llava:7b

# IM 邮件渠道：默认关闭。启用需在运行期（环境变量或安装配置）同时提供
# CAT2BUG_MAIL_ENABLED=true、QUARKUS_MAILER_HOST、QUARKUS_MAILER_PORT、QUARKUS_MAILER_FROM，
# 以及按需 QUARKUS_MAILER_USERNAME / QUARKUS_MAILER_PASSWORD / QUARKUS_MAILER_TLS / QUARKUS_MAILER_START_TLS。
# 此处不得写入任何账号或密码。
cat2bug.mail.enabled=false
quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true

# Cat2AI 反向代理（对齐 Spring cat2bug.proxy.routes.ai）
cat2bug.cloud.host=https://www.cat2bug.com/cloud/api
cat2bug.cloud.timeout-seconds=60
cat2bug.proxy.routes.ai.prefix=cat2ai
cat2bug.proxy.routes.ai.host=https://www.cat2bug.com:3333/prod-api
cat2bug.proxy.routes.ai.timeout=600

# 默认数据源（bootstrap H2 + Flyway）；MyBatis build-time 固定走 runtime-mysql（见 @MapperDataSource，H2 安装亦激活该池）
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cat2bug_quarkus;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# 命名池 build-time 固定 db-kind（打包后不可运行期切换）。默认 H2 对齐本地/安装向导；
# MySQL 生产包请用 -Dquarkus.profile=mysql 或见下方 %mysql。
quarkus.datasource.runtime-mysql.db-kind=h2
quarkus.datasource.runtime-mysql.active=false
quarkus.datasource.runtime-mysql.jdbc.url=jdbc:h2:file:./data/cat2bug_bootstrap_placeholder;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
quarkus.datasource.runtime-mysql.username=root
quarkus.datasource.runtime-mysql.password=cat2bug_password

# legacy：新装 H2 改走 runtime-mysql；保留定义供旧 quarkus-runtime.properties 兼容
quarkus.datasource.runtime-h2.db-kind=h2
quarkus.datasource.runtime-h2.active=false
quarkus.datasource.runtime-h2.jdbc.url=jdbc:h2:file:./data/cat2bug_bootstrap_placeholder;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
quarkus.datasource.runtime-h2.username=root
quarkus.datasource.runtime-h2.password=cat2bug_password

# 「数据监控」页（/druid/*）读取 Agroal 连接池计数
quarkus.datasource.jdbc.enable-metrics=true
quarkus.datasource.runtime-mysql.jdbc.enable-metrics=true
quarkus.datasource.runtime-h2.jdbc.enable-metrics=true

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
# 与 Spring / SetupMigrationService 一致（安装向导已写入 sys_db_version）
quarkus.flyway.table=sys_db_version
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0.5.0
quarkus.flyway.baseline-description=BaseLineInitialize
quarkus.flyway.out-of-order=true
# MySQL 脚本（与 Spring db/migration/mysql 相同）。仅供 SetupMigrationService 按库类型选用，
# 在此声明是为了让 Native 构建期索引；目录名不得以 db/migration 开头（Native 扫描按前缀匹配）。
quarkus.flyway.runtime-mysql.locations=db/mysql
quarkus.flyway.runtime-mysql.migrate-at-start=false

# MyBatis（build-time 固定 runtime-mysql；MySQL/H2 安装均激活该池，database-id 由 quarkus-runtime.properties 覆盖）
quarkus.mybatis.datasource=runtime-mysql
quarkus.mybatis.map-underscore-to-camel-case=true
quarkus.mybatis.mapper-locations=mapper
# bootstrap 默认库；打包默认 H2；MySQL 包见 %mysql
quarkus.mybatis.database-id=h2
quarkus.mybatis.runtime-mysql.database-id=h2
quarkus.mybatis.runtime-h2.database-id=h2

# MySQL 专用打包：mvn -Dquarkus.profile=mysql package …
%mysql.quarkus.datasource.runtime-mysql.db-kind=mysql
%mysql.quarkus.datasource.runtime-mysql.jdbc.url=jdbc:mysql://127.0.0.1:3306/cat2bug_bootstrap_placeholder?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
%mysql.quarkus.datasource.runtime-mysql.username=root
%mysql.quarkus.datasource.runtime-mysql.password=placeholder
%mysql.quarkus.mybatis.runtime-mysql.database-id=mysql

# 定时任务（sys_job）全部为编程式注册，没有 @Scheduled 方法时调度器默认不启动
quarkus.scheduler.start-mode=forced
quarkus.scheduler.cron-type=quartz

# Native
quarkus.native.resources.includes=db/**,mapper/**,oper-log-rules.tsv,i18n/**,defaults/**,报告/**,META-INF/services/io.jsonwebtoken.**
quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21

# Git bare 仓（对齐 Spring cat2bug.git）
cat2bug.git.root=git
cat2bug.git.import-timeout-seconds=120
cat2bug.git.webhook.secret-key=cat2bug-local-git-webhook-secret-key
