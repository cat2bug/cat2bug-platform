cat2bug.install.allow-restart=false
cat2bug.install.config-path=./target/quarkus-test-install/nonexistent-application-install.yml
cat2bug.upgrade.state-path=./target/quarkus-test-upgrade/state.yml

cat2bug.ai.enabled=false
cat2bug.ai.default-business-model=llama3:8b
cat2bug.ai.models=llama3:8b,llava:7b

# MyBatis 指向 runtime-mysql：测试禁用 Dev Services，使用本机 MySQL（见 CLAUDE.md）。
# 测试会写入大量数据，必须使用独立库，不能指向开发库 cat2bug_platform。
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.runtime-mysql.devservices.enabled=false
%test.quarkus.datasource.runtime-mysql.db-kind=mysql
%test.quarkus.datasource.runtime-mysql.active=true
%test.quarkus.datasource.runtime-mysql.jdbc.url=jdbc:mysql://127.0.0.1:3306/cat2bug_platform_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
%test.quarkus.datasource.runtime-mysql.username=root
%test.quarkus.datasource.runtime-mysql.password=cat2bug_password
%test.quarkus.flyway.datasource=runtime-mysql
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.runtime-mysql.migrate-at-start=true
%test.quarkus.flyway.runtime-mysql.table=sys_db_version
%test.quarkus.flyway.runtime-mysql.baseline-on-migrate=true
%test.quarkus.flyway.runtime-mysql.baseline-version=0.5.0
%test.quarkus.flyway.runtime-mysql.out-of-order=true
%test.quarkus.mybatis.database-id=mysql
%test.quarkus.mybatis.runtime-mysql.database-id=mysql
