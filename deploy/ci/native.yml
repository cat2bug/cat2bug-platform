# Quarkus Native CI（复制到 .github/workflows/native.yml 或 GitLab CI）

name: native

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'cat2bug-platform-admin/**'
      - 'cat2bug-platform-*/**'
      - 'cat2bug-platform-ui/**'
      - 'deploy/build-native.sh'
      - 'deploy/rpm/cat2bug/**'

jobs:
  native-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            goarch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: cat2bug-platform-ui/package-lock.json

      - name: JVM tests
        run: mvn -pl cat2bug-platform-admin -am test

      - name: Native build
        run: ./deploy/build-native.sh ${{ matrix.arch }}

      - name: Smoke health
        run: |
          BIN=./cat2bug-platform-admin/target/cat2bug-admin-linux-${{ matrix.goarch }}
          "$BIN" &
          PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:2020/q/health/ready && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:2020/version
          kill $PID

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: cat2bug-admin-${{ matrix.arch }}
          path: cat2bug-platform-admin/target/cat2bug-admin-linux-*

  rpm-amd64:
    needs: native-matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cat2bug-admin-x86_64
          path: cat2bug-platform-admin/target/
      - name: Install nfpm
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.41.2/nfpm_2.41.2_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build RPM
        env:
          NFPM_VERSION: 1.0.0
        run: |
          chmod +x deploy/rpm/cat2bug/build-rpm.sh
          ./deploy/rpm/cat2bug/build-rpm.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: cat2bug-platform-rpm-x86_64
          path: deploy/rpm/cat2bug/dist/*.rpm
