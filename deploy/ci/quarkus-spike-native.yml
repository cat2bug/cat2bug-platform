# Quarkus Spike Native CI 草案（手动复制到 .github/workflows/ 或 GitLab CI）
#
# 双矩阵：linux/amd64 + linux/arm64
# 前置：Mandrel builder 镜像、nfpm（RPM 步骤可选）

name: quarkus-spike-native

on:
  workflow_dispatch:
  push:
    paths:
      - 'cat2bug-platform-quarkus-spike/**'
      - 'deploy/rpm/spike/**'

jobs:
  native-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            goarch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: JVM tests
        run: mvn -pl cat2bug-platform-quarkus-spike -Pquarkus-spike test

      - name: Native build
        run: ./cat2bug-platform-quarkus-spike/build-native.sh ${{ matrix.arch }}

      - name: Smoke (health)
        run: |
          BIN=./cat2bug-platform-quarkus-spike/target/cat2bug-spike-linux-${{ matrix.goarch }}
          "$BIN" &
          PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:2020/q/health/ready && break
            sleep 0.2
          done
          curl -sf http://127.0.0.1:2020/version
          kill $PID

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: cat2bug-spike-${{ matrix.arch }}
          path: cat2bug-platform-quarkus-spike/target/cat2bug-spike-linux-*

  # 可选：在 amd64 runner 上打 RPM（需 nfpm）
  # rpm:
  #   needs: native-matrix
  #   runs-on: ubuntu-latest
  #   steps: ...
