name: cat2bug-platform
services:
  cat2bug-platform-redis:
    image: redis:latest
    hostname: redis
    container_name: cat2bug-platform-redis
    restart: always
    expose:
      - "6379"
    healthcheck:
      test: "exit 0"
    networks:
      - cat2bug-network
  cat2bug-platform-mysql:
    hostname: mysql
    build:
      dockerfile: mysql-dockerfile
    container_name: cat2bug-platform-mysql
    restart: always
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --interactive_timeout=259200
      --wait_timeout=259200
      --max_connections=1000
    volumes:
      - ./mysql-data:/var/lib/mysql
    expose:
      - "3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: cat2bug_platform
      MYSQL_ROOT_PASSWORD: cat2bug_password
      MYSQL_USER: cat2bug
      MYSQL_PASSWORD: cat2bug_password
    healthcheck:
      test: "mysql -h127.0.0.1 -P3306 -uroot -pcat2bug_password -e 'SHOW DATABASES;'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - cat2bug-network
  cat2bug-platform-web-after:
    hostname: after
    build:
      dockerfile: after-dockerfile
    container_name: cat2bug-platform-web-after
    restart: always
    expose:
      - "2020"
    environment:
      TZ: Asia/Shanghai
      CAT2BUG_IN_DOCKER: "true"
      # 存储根（上传、头像、Git bare 仓 git/ 子目录），须与下方卷挂载点一致
      CAT2BUG_PROFILE: /home/uploadPath
      # 运行期即生效：cache.type=redis 时必须同时给出 redis.hosts，否则启动失败
      CAT2BUG_CACHE_TYPE: redis
      CAT2BUG_REDIS_HOSTS: redis://cat2bug-platform-redis:6379
      # 仅用于安装向导预填（GET /setup/preflight）。MySQL 连接只认这组变量名（对应 install YAML 的
      # spring.datasource.druid.master.*），并据 jdbc:mysql 推断数据库类型；运行期数据源由向导写入 config/install
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://cat2bug-platform-mysql:3306/cat2bug_platform?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: cat2bug_password
      CAT2BUG_SETUP_REDIS_HOST: cat2bug-platform-redis
      # 可选：安装向导 AI 步骤预填 Ollama 地址
      # CAT2BUG_AI_HOST: http://ollama:11434
      # 已 completed install + 换 JAR 有待执行 Flyway 时：跳过 /upgrade UI，启动期静默 migrate；失败则容器 exit 1
      # CAT2BUG_UPGRADE_SKIP: "true"
    volumes:
      - ./uploadPath:/home/uploadPath
      # 安装向导写入的 application-install.yml / quarkus-runtime.properties；丢失则重建容器后回到 /setup
      - ./config:/home/config
    links:
      - cat2bug-platform-mysql
      - cat2bug-platform-redis
    depends_on:
      cat2bug-platform-mysql:
        condition: service_healthy
      cat2bug-platform-redis:
        condition: service_healthy
    healthcheck:
      test: "exit 0"
    networks:
      - cat2bug-network
  cat2bug-platform-web-front:
    hostname: front
    build:
      dockerfile: front-dockerfile
    container_name: cat2bug-platform-web-front
    restart: always
    ports:
      - "8022:8022"
    links:
      - cat2bug-platform-web-after
    depends_on:
      cat2bug-platform-web-after:
        condition: service_healthy
    networks:
      - cat2bug-network
networks:
  cat2bug-network:
    driver: bridge