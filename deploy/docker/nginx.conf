worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 外层反代已终止 TLS 时透传其 Proto；否则用本层 $scheme
    map $http_x_forwarded_proto $cat2bug_forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }
    map $http_x_forwarded_host $cat2bug_forwarded_host {
        ""      $host;
        default $http_x_forwarded_host;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            index  index.html index.htm;
        }

        # API 也必须带 Forwarded，否则 MCP 设置推导的 public URL 会变成 http
        location /prod-api/ {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $cat2bug_forwarded_proto;
            proxy_set_header X-Forwarded-Host $cat2bug_forwarded_host;
            proxy_set_header X-NginX-Proxy true;
            rewrite ^/prod-api/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:2020;
        }

        # OAuth / MCP：原样转发，不剥前缀；关闭缓冲以支持 Streamable HTTP / SSE
        location ~ ^/(oauth/(authorize|register|token|revoke)$|\.well-known/|mcp(/|$)) {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $cat2bug_forwarded_proto;
            proxy_set_header X-Forwarded-Host $cat2bug_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_pass http://127.0.0.1:2020;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:2020/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $cat2bug_forwarded_proto;
            proxy_set_header X-Forwarded-Host $cat2bug_forwarded_host;
            proxy_set_header X-NginX-Proxy true;
            proxy_connect_timeout 60s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 60s;
        }

        # 授权页：禁止被嵌入 iframe，降低点击劫持风险
        location = /oauth/consent {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
