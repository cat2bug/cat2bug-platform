# Cat2Bug Platform Native — RPM 默认配置（安装为 /etc/cat2bug/platform.properties）
# 经软链 /var/lib/cat2bug-platform/config/application.properties 被 Quarkus 按「工作目录 config/application.properties」加载，
# 优先级高于内置 application.properties；安装向导写入的 config/install/quarkus-runtime.properties 再覆盖本文件。

quarkus.http.host=0.0.0.0
quarkus.http.port=2020

cat2bug.install.config-path=/var/lib/cat2bug-platform/config/install/application-install.yml
cat2bug.profile=/var/lib/cat2bug-platform/upload
cat2bug.temp=/var/lib/cat2bug-platform/tmp
cat2bug.cache.type=local

quarkus.log.file.enabled=true
quarkus.log.file.path=/var/log/cat2bug-platform/cat2bug-admin.log
